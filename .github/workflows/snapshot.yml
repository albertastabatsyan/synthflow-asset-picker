name: snapshot-shared-state
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot bucket + library + categories
        run: |
          mkdir -p snapshots
          curl -sf https://synthflow-asset-picker-bucket.albertastabatsyan.workers.dev/picks      -o snapshots/picks.json
          curl -sf https://synthflow-asset-picker-bucket.albertastabatsyan.workers.dev/library    -o snapshots/library.json
          curl -sf https://synthflow-asset-picker-bucket.albertastabatsyan.workers.dev/categories -o snapshots/categories.json
      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots
          git diff --cached --quiet || { git commit -m "snapshot: shared bucket + library"; git push; }
